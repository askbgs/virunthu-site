server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  # one address for Google: www.virunthu.shop -> virunthu.shop
  if ($host = www.virunthu.shop) { return 301 https://virunthu.shop$request_uri; }

  gzip on;
  gzip_vary on;
  gzip_types text/html text/css text/plain application/javascript application/json application/xml application/manifest+json image/svg+xml;

  location / { try_files $uri $uri/ =404; }
  error_page 404 /404.html;
  location = /404.html { internal; }

  location ~* \.(html)$ { add_header Cache-Control "no-cache"; }
  location ~* \.(jpg|jpeg|png|svg|webp|mp4|woff2)$ { expires 30d; add_header Cache-Control "public"; }
  location = /site.webmanifest { default_type application/manifest+json; }
}
